    <script>
      const API_URL = "api.php";

      const DOM = {
        qrImage: document.getElementById("qrImage"),
        countdownFill: document.getElementById("countdownFill"),
        countdownNote: document.getElementById("countdownNote"),
        status: document.getElementById("status"),
        tableBody: document.getElementById("tableBody"),
        dataTable: document.getElementById("dataTable"),
        loadingData: document.getElementById("loadingData"),
        totalMahasiswa: document.getElementById("totalMahasiswa"),
        statusDot: document.getElementById("statusDot"),
        statusLabel: document.getElementById("statusLabel"),
      };

      let qrExpiresAt = 0;
      let qrTickTimer = null;
      let isFetchingQr = false; // cegah request numpuk kalau fetch lambat/gagal berulang

      function showStatus(message, type = "info", duration = 4000) {
        const iconMap = {
          success: "fa-check-circle", error: "fa-exclamation-circle",
          warning: "fa-triangle-exclamation", info: "fa-info-circle",
        };
        DOM.status.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
        DOM.status.className = "status " + type;
        DOM.status.style.display = "flex";
        clearTimeout(DOM.status._hideTimeout);
        DOM.status._hideTimeout = setTimeout(() => { DOM.status.style.display = "none"; }, duration);
      }

      function setConnectionStatus(status, message) {
        DOM.statusDot.className = "dot " + status;
        DOM.statusLabel.textContent = message;
      }

      // ============================================================
      // QR SESI (auto-refresh)
      // ============================================================
      async function fetchQrToken() {
        if (isFetchingQr) return; // sudah ada request berjalan, jangan numpuk
        isFetchingQr = true;
        try {
          const res = await fetch(API_URL + "?action=get_qr_token", {
            headers: { Accept: "application/json" },
          });
          if (res.status === 401) {
            window.location.href = "login.php";
            return;
          }

          let data = null;
          try {
            data = await res.json();
          } catch (parseErr) {
            // Respons bukan JSON valid (mis. fatal error PHP) - tampilkan
            // status code-nya supaya lebih mudah didiagnosis daripada
            // cuma "gagal ambil QR" generik.
            setConnectionStatus("offline", `Respons server tidak valid (HTTP ${res.status})`);
            return;
          }

          if (!res.ok || data.error) {
            setConnectionStatus("offline", `${data.detail || data.error || "Gagal ambil QR (HTTP " + res.status + ")"}`);
            return;
          }

          if (data && data.token) {
            const qrPayload = JSON.stringify({ token: data.token });
            DOM.qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(qrPayload)}`;
            qrExpiresAt = data.expires_at * 1000;
            setConnectionStatus("online", "Terhubung ke server");
          }
        } catch (e) {
          // Network error murni (server tidak terjangkau sama sekali)
          setConnectionStatus("offline", "Tidak bisa terhubung ke server");
        } finally {
          isFetchingQr = false;
        }
      }

      function tickCountdown() {
        const remainingMs = qrExpiresAt - Date.now();
        if (remainingMs <= 0) {
          DOM.countdownNote.textContent = "Mengambil QR baru...";
          DOM.countdownFill.style.width = "0%";
          fetchQrToken();
          return;
        }
        const totalMs = <?= (int) QR_SESI_DURASI ?> * 1000;
        const pct = Math.max(0, Math.min(100, (remainingMs / totalMs) * 100));
        DOM.countdownFill.style.width = pct + "%";
        DOM.countdownNote.textContent = `QR berlaku ${Math.ceil(remainingMs / 1000)} detik lagi`;
      }

      // ============================================================
      // DATA MAHASISWA
      // ============================================================
      function renderDataTable(data) {
        DOM.tableBody.innerHTML = "";
        if (!data || data.length === 0) {
          DOM.loadingData.innerHTML = '<i class="fas fa-info-circle"></i> Tidak ada data';
          DOM.loadingData.style.display = "block";
          DOM.dataTable.style.display = "none";
          return;
        }
        data.forEach((mhs) => {
          const isHadir = !!(mhs.hadir_hari_ini === 1 || mhs.hadir_hari_ini === true);
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${mhs.nim || "-"}</td>
            <td>${mhs.nama || "-"}</td>
            <td>${mhs.kelas || "-"}</td>
            <td>
              <span class="${isHadir ? "status-hadir" : "status-belum"}">
                <i class="fas ${isHadir ? "fa-check-circle" : "fa-circle"}"></i>
                ${isHadir ? "Hadir" : "Belum"}
              </span>
            </td>`;
          DOM.tableBody.appendChild(row);
        });
        DOM.loadingData.style.display = "none";
        DOM.dataTable.style.display = "table";
      }

      async function loadDataMahasiswa() {
        DOM.loadingData.style.display = "block";
        DOM.dataTable.style.display = "none";
        DOM.loadingData.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengambil data...';
        try {
          const response = await fetch(API_URL + "?action=get_all", {
            headers: { Accept: "application/json" },
          });
          if (response.status === 401) {
            window.location.href = "login.php";
            return;
          }
          const data = await response.json();
          if (Array.isArray(data)) {
            renderDataTable(data);
            DOM.totalMahasiswa.textContent = data.length + " mahasiswa";
            setConnectionStatus("online", "Online");
            showStatus(`${data.length} data mahasiswa dimuat`, "success", 2500);
          } else {
            renderDataTable([]);
          }
        } catch (error) {
          DOM.loadingData.innerHTML = `<i class="fas fa-exclamation-circle"></i> Gagal memuat data: ${error.message}`;
          setConnectionStatus("offline", "Gagal terhubung");
        }
      }

      // ============================================================
      // BACKGROUND MORPH-REVEAL TRAIL
      // Mouse/touch trail "menghapus" gambar bunga depan sehingga
      // gambar bunga kedua di belakangnya muncul mengikuti bentuk
      // blob yang memudar.
      //
      // FIX iPad: versi lama pakai CSS mask-image yang di-generate
      // ulang lewat canvas.toDataURL() setiap frame (60x/detik).
      // Encoding PNG base64 sebanyak itu sangat berat dan implementasi
      // mask-image dinamis di Safari/WebKit iOS tidak stabil, jadi
      // bikin animasi patah-patah / macet / glitch di iPad.
      //
      // Sekarang efeknya digambar langsung di dua elemen <canvas>
      // yang ditumpuk (tanpa mask, tanpa toDataURL), jauh lebih ringan
      // dan stabil di WebKit.
      // ============================================================
      const TRAIL_MAX_POINTS = 60;
      const TRAIL_HEAD_R = 140;
      const TRAIL_NOISE_AMP = 44;
      const TRAIL_BLOB_PTS = 24;
      const TRAIL_FADE_SPEED = 0.92;
      const TRAIL_SAMPLE_DIST = 8;

      function drawMorphBlob(ctx, cx, cy, r, t, seed) {
        if (r < 2) return;
        const pts = [];
        for (let i = 0; i < TRAIL_BLOB_PTS; i++) {
          const angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
          const n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
          const n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
          const n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
          const noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
          const rad = r + noise;
          pts.push({ x: cx + Math.cos(angle) * rad, y: cy + Math.sin(angle) * rad });
        }
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const curr = pts[i];
          const next = pts[(i + 1) % pts.length];
          const midX = (curr.x + next.x) / 2;
          const midY = (curr.y + next.y) / 2;
          if (i === 0) ctx.moveTo(midX, midY);
          else ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
        }
        ctx.closePath();
        ctx.fill();
      }

      // Menggambar image dengan perilaku seperti CSS object-fit: cover
      function drawCover(ctx, img, w, h) {
        if (!img || !img.naturalWidth) return;
        const ir = img.naturalWidth / img.naturalHeight;
        const cr = w / h;
        let dw, dh, dx, dy;
        if (ir > cr) {
          dh = h; dw = h * ir; dx = (w - dw) / 2; dy = 0;
        } else {
          dw = w; dh = w / ir; dx = 0; dy = (h - dh) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
      }

      function initBackgroundTrail() {
        const revealCanvas = document.getElementById("bgReveal");
        const frontCanvas = document.getElementById("bgFront");
        if (!revealCanvas || !frontCanvas) return;

        const revealCtx = revealCanvas.getContext("2d");
        const frontCtx = frontCanvas.getContext("2d");

        const revealImg = new Image();
        const frontImg = new Image();
        revealImg.crossOrigin = "anonymous";
        frontImg.crossOrigin = "anonymous";
        revealImg.src = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85";
        frontImg.src = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85";

        let points = [];
        let hovering = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let headRadius = 0;
        let lastSample = { x: mouseX, y: mouseY };
        let idleLastSample = { x: mouseX, y: mouseY };
        let time = 0;
        let started = false;

        function resizeCanvases() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          [revealCanvas, frontCanvas].forEach((c) => {
            c.width = window.innerWidth * dpr;
            c.height = window.innerHeight * dpr;
            c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
          });
          // Reveal layer statis, cukup digambar ulang saat resize
          drawCover(revealCtx, revealImg, window.innerWidth, window.innerHeight);
        }
        resizeCanvases();
        window.addEventListener("resize", resizeCanvases);

        window.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          hovering = true;
        });
        document.addEventListener("mouseleave", () => {
          hovering = false;
        });
        window.addEventListener("touchmove", (e) => {
          const t = e.touches[0];
          if (!t) return;
          mouseX = t.clientX;
          mouseY = t.clientY;
          hovering = true;
        }, { passive: true });
        window.addEventListener("touchend", () => {
          hovering = false;
        });

        function tick() {
          const w = window.innerWidth;
          const h = window.innerHeight;

          const targetR = hovering ? TRAIL_HEAD_R : 0;
          headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);

          if (hovering && headRadius > 5) {
            const dx = mouseX - lastSample.x;
            const dy = mouseY - lastSample.y;
            if (points.length === 0 || Math.hypot(dx, dy) > TRAIL_SAMPLE_DIST) {
              points.push({ x: mouseX, y: mouseY, r: headRadius, alpha: 1, seed: Math.random() * 100 });
              if (points.length > TRAIL_MAX_POINTS) points.shift();
              lastSample = { x: mouseX, y: mouseY };
            }
          } else {
            // Belum ada interaksi mouse — kirim blob melayang pelan
            // otomatis supaya background tetap hidup, bukan diam.
            const idleX = w * 0.5 + Math.sin(time * 0.28) * w * 0.22;
            const idleY = h * 0.42 + Math.cos(time * 0.21) * h * 0.18;
            const dx = idleX - idleLastSample.x;
            const dy = idleY - idleLastSample.y;
            if (points.length === 0 || Math.hypot(dx, dy) > TRAIL_SAMPLE_DIST) {
              points.push({ x: idleX, y: idleY, r: TRAIL_HEAD_R * 0.6, alpha: 1, seed: Math.random() * 100 });
              if (points.length > TRAIL_MAX_POINTS) points.shift();
              idleLastSample = { x: idleX, y: idleY };
            }
          }

          points.forEach((p) => {
            p.alpha *= TRAIL_FADE_SPEED;
            p.r *= 0.995;
          });
          points = points.filter((p) => p.alpha >= 0.01);
          time += 0.016;

          // Gambar ulang front layer penuh, lalu "lubangi" pakai blob trail
          // supaya reveal layer di baliknya terlihat lewat lubang tsb.
          frontCtx.clearRect(0, 0, w, h);
          drawCover(frontCtx, frontImg, w, h);
          frontCtx.globalCompositeOperation = "destination-out";
          points.forEach((p) => {
            frontCtx.globalAlpha = p.alpha;
            drawMorphBlob(frontCtx, p.x, p.y, p.r, time, p.seed);
          });
          frontCtx.globalAlpha = 1;
          frontCtx.globalCompositeOperation = "source-over";

          requestAnimationFrame(tick);
        }

        function startOnce() {
          if (started) return;
          started = true;
          tick();
        }

        frontImg.onload = startOnce;
        revealImg.onload = () => drawCover(revealCtx, revealImg, window.innerWidth, window.innerHeight);

        // Jaga-jaga kalau gambar sudah cached dan event "load" tidak fire lagi
        if (frontImg.complete && frontImg.naturalWidth) startOnce();
        if (revealImg.complete && revealImg.naturalWidth) {
          drawCover(revealCtx, revealImg, window.innerWidth, window.innerHeight);
        }
      }

      async function init() {
        initBackgroundTrail();
        setTimeout(() => document.body.classList.remove("anim"), 1400);
        await fetchQrToken();
        await loadDataMahasiswa();
        qrTickTimer = setInterval(tickCountdown, 1000);
        setInterval(loadDataMahasiswa, 15000);
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
